name: Godot courtyard checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  import-play-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install software display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 ffmpeg
      - name: Import, test gameplay, and render
        run: xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' env LIBGL_ALWAYS_SOFTWARE=1 python3 tools/check_project.py --render --showcase --screenshot "$RUNNER_TEMP/courtyard.png"
      - name: Encode actual Godot motion frames
        run: ffmpeg -hide_banner -loglevel error -framerate 20 -i "$RUNNER_TEMP/courtyard-motion/frame%03d.png" -c:v libx264 -crf 20 -pix_fmt yuv420p "$RUNNER_TEMP/courtyard-motion.mp4"
      - name: Save rendered proof
        uses: actions/upload-artifact@v4
        with:
          name: courtyard-render
          path: |
            ${{ runner.temp }}/courtyard*.png
            ${{ runner.temp }}/courtyard-motion.mp4
          if-no-files-found: error
